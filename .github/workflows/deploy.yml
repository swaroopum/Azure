name: Deploy ARM/Bicep to Azure

on:
  push:
    branches:
      - main 

permissions:
  id-token: write 
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: GitHub-il ninnu code edukkunnu
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: OIDC upayogichu Azure-il login cheyyunnu
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Step 3: Template deploy cheyyunnu
      - name: Deploy Template
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: 'my-first-terraform-rg' 
          template: ./template.json
